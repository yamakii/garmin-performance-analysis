# Dependabot: keeps dependencies current without manual `uv lock --upgrade` /
# `npm update` sessions. See docs/maintenance.md for the update policy.
#
# - minor + patch updates are grouped into ONE PR per ecosystem per week so the
#   review/merge cost stays flat. They are auto-merged after `ci-guard` passes
#   (.github/workflows/dependabot-auto-merge.yml).
# - major updates get their own PR and always wait for a human decision.
# - security updates are raised as soon as an advisory is published (separate
#   from the schedule) and are also covered by the weekly security-audit workflow.
version: 2
updates:
  # Python — uv workspace (root uv.lock covers garmin-mcp-server + garmin-web)
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Tokyo"
    open-pull-requests-limit: 5
    groups:
      python-minor-patch:
        update-types: ["minor", "patch"]

  # Frontend — Vite + React SPA
  - package-ecosystem: "npm"
    directory: "/packages/garmin-web/frontend"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Tokyo"
    open-pull-requests-limit: 5
    groups:
      npm-minor-patch:
        update-types: ["minor", "patch"]

  # GitHub Actions used by ci.yml / security-audit.yml / dependabot-auto-merge.yml
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
      timezone: "Asia/Tokyo"
    groups:
      github-actions:
        patterns: ["*"]

  # Claude Code sandbox image base (docker/Dockerfile)
  - package-ecosystem: "docker"
    directory: "/docker"
    schedule:
      interval: "monthly"
      timezone: "Asia/Tokyo"
