name: CI

# Least-privilege GITHUB_TOKEN: nothing in this workflow writes to the repo.
permissions:
  contents: read

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
      web: ${{ steps.filter.outputs.web }}
      meta: ${{ steps.filter.outputs.meta }}
      docker: ${{ steps.filter.outputs.docker }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            code:
              - 'packages/**'
              - 'pyproject.toml'
              # Lockfile-only PRs (Dependabot) must still run lint-and-test,
              # otherwise ci-guard passes vacuously on a dependency bump.
              - 'uv.lock'
              - '.pre-commit-config.yaml'
              - '.github/workflows/**'
              - 'docs/**'
              - '**/*.md'
              - '.env.example'
            web:
              - 'packages/garmin-web/**'
              - '.github/workflows/**'
            meta:
              - '.claude/workflows/**'
              - '.claude/hooks/**'
              - '.claude/agents/**'
              - '.claude/settings.json'
              - 'scripts/**'
            docker:
              - 'docker/**'
              - '.github/workflows/**'

  lint-and-test:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/garmin-mcp-server
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.0.1
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Lint with ruff
        run: uv run ruff check .

      - name: Check formatting with black
        run: uv run black --check .

      - name: Type check with mypy
        run: uv run mypy .

      - name: Run unit and integration tests with coverage
        # Cap BLAS/OpenMP thread pools so xdist workers don't exhaust the pid
        # quota (`can't start new thread`). Mirrors conftest; also covers
        # subprocess-spawning tests. See issue #740.
        env:
          OPENBLAS_NUM_THREADS: "1"
          OMP_NUM_THREADS: "1"
          MKL_NUM_THREADS: "1"
        run: uv run pytest -m "unit or integration" --tb=short -n 4 --maxfail=5 --cov=garmin_mcp --cov-report=term-missing --cov-fail-under=60

  web-backend:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/garmin-web
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.0.1
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync

      - name: Lint with ruff
        run: uv run ruff check src/ tests/

      - name: Run unit and integration tests
        # Cap BLAS/OpenMP thread pools (see lint-and-test / issue #740).
        env:
          OPENBLAS_NUM_THREADS: "1"
          OMP_NUM_THREADS: "1"
          MKL_NUM_THREADS: "1"
        run: uv run pytest -m "unit or integration" --tb=short

  web-frontend:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/garmin-web/frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: packages/garmin-web/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Run tests
        run: npx vitest run

      - name: Build
        run: npm run build

  meta-checks:
    needs: changes
    if: needs.changes.outputs.meta == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Syntax-smoke .claude scripts
        run: bash scripts/check-claude-scripts.sh

  # The sandbox image is not exercised anywhere else, so a docker/** change
  # (Dependabot base-image bumps included) must at least build and boot.
  # The entrypoint needs root + NET_ADMIN for the egress firewall, so the smoke
  # bypasses it and only checks the toolchain the image promises.
  docker-build:
    needs: changes
    if: needs.changes.outputs.docker == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Build sandbox image
        run: |
          docker build \
            --build-arg CLAUDE_CODE_VERSION=latest \
            --build-arg USER_UID=1000 \
            --build-arg USER_GID=1000 \
            -t garmin-claude-sandbox:ci \
            docker/

      - name: Smoke the toolchain inside the image
        run: |
          docker run --rm --entrypoint bash --user 1000:1000 garmin-claude-sandbox:ci -c '
            set -euo pipefail
            uv --version
            uv python find 3.12
            node --version
            claude --version
          '

  ci-guard:
    needs: [changes, lint-and-test, web-backend, web-frontend, meta-checks, docker-build]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check CI result
        run: |
          if [ "${{ needs.changes.outputs.code }}" == "false" ] && [ "${{ needs.changes.outputs.web }}" == "false" ] && [ "${{ needs.changes.outputs.meta }}" == "false" ] && [ "${{ needs.changes.outputs.docker }}" == "false" ]; then
            echo "No code/doc/meta/docker changes — skipping CI"
            exit 0
          fi
          if [ "${{ needs.changes.outputs.docker }}" == "true" ] && [ "${{ needs.docker-build.result }}" != "success" ]; then
            echo "docker-build failed"
            exit 1
          fi
          if [ "${{ needs.changes.outputs.code }}" == "true" ] && [ "${{ needs.lint-and-test.result }}" != "success" ]; then
            echo "lint-and-test failed"
            exit 1
          fi
          if [ "${{ needs.changes.outputs.web }}" == "true" ] && [ "${{ needs.web-backend.result }}" != "success" ]; then
            echo "web-backend failed"
            exit 1
          fi
          if [ "${{ needs.changes.outputs.web }}" == "true" ] && [ "${{ needs.web-frontend.result }}" != "success" ]; then
            echo "web-frontend failed"
            exit 1
          fi
          if [ "${{ needs.changes.outputs.meta }}" == "true" ] && [ "${{ needs.meta-checks.result }}" != "success" ]; then
            echo "meta-checks failed"
            exit 1
          fi
